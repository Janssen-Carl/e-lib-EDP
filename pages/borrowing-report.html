<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrowing Report</title>
    <link rel="stylesheet" href="../styles/shared.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .page-header { margin-bottom: 30px; }
        .report-controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .date-range { display: flex; gap: 10px; align-items: center; }
        .btn { padding: 10px 20px; background: #2563EB; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #1D4ED8; }
        .btn-secondary { background: #64748B; }
        .btn-secondary:hover { background: #475569; }
        .btn-export { background: #22C55E; }
        .btn-export:hover { background: #16A34A; }
        input[type="date"] { padding: 8px 12px; border: 1.5px solid #E2E8F0; border-radius: 6px; }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .summary-card { background: #F8FAFC; padding: 15px; border-radius: 8px; border-left: 4px solid #2563EB; }
        .summary-card.overdue { border-left-color: #EF4444; }
        .summary-card.success { border-left-color: #22C55E; }
        .summary-value { font-size: 28px; font-weight: 700; color: #1E293B; }
        .summary-label { font-size: 12px; color: #64748B; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #2563EB; color: white; padding: 12px; text-align: left; font-weight: 600; }
        td { padding: 12px; border-bottom: 1px solid #E2E8F0; }
        tr:hover { background: #F8FAFC; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .badge-active { background: #D1FAE5; color: #065F46; }
        .badge-overdue { background: #FEE2E2; color: #991B1B; }
        .badge-returned { background: #D1D5DB; color: #374151; }
        .alert { padding: 12px 15px; border-radius: 6px; margin-bottom: 15px; }
        .alert-success { background: #D1FAE5; color: #065F46; border: 1px solid #6EE7B7; }
        .alert-error { background: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>📊 Borrowing Transactions Report</h1>
            <p>Comprehensive analysis of all book borrowing activities</p>
        </div>

        <div id="alertContainer"></div>

        <!-- Report Controls -->
        <div class="report-controls">
            <div class="date-range">
                <label>From:</label>
                <input type="date" id="startDate">
                <label>To:</label>
                <input type="date" id="endDate">
            </div>
            <select id="statusFilter" style="padding: 8px 12px; border: 1.5px solid #E2E8F0; border-radius: 6px;">
                <option value="">All Statuses</option>
                <option value="Active">Active</option>
                <option value="Overdue">Overdue</option>
                <option value="Returned">Returned</option>
            </select>
            <button class="btn" onclick="generateReport()">Generate Report</button>
            <button class="btn btn-export" onclick="exportToExcel()">
                <i class="fas fa-file-excel"></i> Export to Excel
            </button>
        </div>

        <!-- Summary Cards -->
        <div class="summary-grid" id="summaryContainer"></div>

        <!-- Data Table -->
        <div style="overflow-x: auto;">
            <table id="reportTable" class="display">
                <thead>
                    <tr>
                        <th>Transaction ID</th>
                        <th>Member Name</th>
                        <th>Email</th>
                        <th>Book Title</th>
                        <th>ISBN</th>
                        <th>Category</th>
                        <th>Borrow Date</th>
                        <th>Due Date</th>
                        <th>Return Date</th>
                        <th>Status</th>
                        <th>Days Overdue</th>
                        <th>Estimated Fine</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
    <script>
        const API_URL = 'backend/public/transactions-api.php';
        let reportData = [];
        let dataTable = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Set default dates
            const today = new Date();
            const thirtydaysAgo = new Date(today.getTime() - (30 * 24 * 60 * 60 * 1000));
            
            document.getElementById('startDate').valueAsDate = thirtydaysAgo;
            document.getElementById('endDate').valueAsDate = today;

            generateReport();
        });

        /**
         * Generate report
         */
        function generateReport() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const status = document.getElementById('statusFilter').value;

            let url = `${API_URL}?endpoint=borrowing-report`;
            if (startDate) url += `&startDate=${startDate}`;
            if (endDate) url += `&endDate=${endDate}`;
            if (status) url += `&status=${status}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        reportData = data.data;
                        displayReport(data);
                    } else {
                        showAlert('Error: ' + data.message, 'error');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showAlert('Failed to generate report', 'error');
                });
        }

        /**
         * Display report
         */
        function displayReport(data) {
            // Display summary cards
            const summaryContainer = document.getElementById('summaryContainer');
            const summary = data.summary;

            summaryContainer.innerHTML = `
                <div class="summary-card">
                    <div class="summary-value">${summary.total}</div>
                    <div class="summary-label">Total Borrowings</div>
                </div>
                <div class="summary-card success">
                    <div class="summary-value">${summary.active}</div>
                    <div class="summary-label">Active Borrowings</div>
                </div>
                <div class="summary-card overdue">
                    <div class="summary-value">${summary.overdue}</div>
                    <div class="summary-label">Overdue Books</div>
                </div>
                <div class="summary-card">
                    <div class="summary-value">${summary.returned}</div>
                    <div class="summary-label">Returned</div>
                </div>
                <div class="summary-card" style="border-left-color: #F59E0B;">
                    <div class="summary-value">₱${(summary.totalEstimatedFines || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</div>
                    <div class="summary-label">Total Estimated Fines</div>
                </div>
            `;

            // Display table
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.data.forEach(record => {
                const statusBadge = `<span class="badge badge-${record.Status.toLowerCase()}">${record.Status}</span>`;
                const row = document.createElement('tr');

                row.innerHTML = `
                    <td>${record.TransactionID}</td>
                    <td>${record.MemberName}</td>
                    <td>${record.MemberEmail}</td>
                    <td>${record.BookTitle}</td>
                    <td>${record.ISBN}</td>
                    <td>${record.Category_Name || '-'}</td>
                    <td>${new Date(record.BorrowDate).toLocaleDateString()}</td>
                    <td>${new Date(record.DueDate).toLocaleDateString()}</td>
                    <td>${record.ReturnDate ? new Date(record.ReturnDate).toLocaleDateString() : '-'}</td>
                    <td>${statusBadge}</td>
                    <td>${record.DaysOverdue || 0}</td>
                    <td>₱${(record.EstimatedFine || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                `;
                tbody.appendChild(row);
            });
        }

        /**
         * Export to Excel
         */
        function exportToExcel() {
            if (reportData.length === 0) {
                showAlert('No data to export. Please generate report first.', 'error');
                return;
            }

            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const status = document.getElementById('statusFilter').value;

            const payload = {
                startDate: startDate,
                endDate: endDate,
                status: status,
                generatedBy: JSON.parse(localStorage.getItem('user') || '{}').FullName || 'Administrator'
            };

            showAlert('Generating Excel file...', 'success');

            fetch(`${API_URL}?endpoint=export-borrowing-excel`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // Download the file
                    const link = document.createElement('a');
                    link.href = data.filepath;
                    link.download = data.filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showAlert('Excel report downloaded successfully!', 'success');
                } else {
                    showAlert('Error: ' + data.message, 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showAlert('Failed to export report', 'error');
            });
        }

        /**
         * Show alert
         */
        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
            alertContainer.innerHTML = `<div class="alert ${alertClass}">${message}</div>`;
            setTimeout(() => {
                alertContainer.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
